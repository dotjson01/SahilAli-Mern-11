<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Node.js Server! 🚀</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.3rem;
            margin-bottom: 30px;
        }
        .badge {
            background: #8bc34a;
            color: #1a4d2e;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Server is Running!</h1>
        <p>Congratulations! Your Node.js server is serving this page.</p>
        <div class="badge">✓ Server Status: Active</div>
        <p style="margin-top: 30px; font-size: 1rem;">
            This HTML page is being served by your Node.js backend!
        </p>
    </div>
</body>
</html>
