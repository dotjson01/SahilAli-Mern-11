<!doctype html>
<html lang="en">

<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS v5.2.1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <title>
        To-Do List App
    </title>
</head>

<body class="bg-light">
    <header>
        <!-- place navbar here -->
    </header>
    <main class="container my-5"> <!--Centers content with margin -->
        <div class="row justify-content-center">
            <div class="col-md-6">

                <!--Card Container -->
                <div class="card-shadow"> <!--Card component -->

                    <!--Card Header-->
                    <div class="card-header bg-primary text-white text-center">
                        <h2>📝My To-Do-list</h2>
                    </div>

                    <!--Card Body-->
                    <div class="card-body">

                        <!--Input group where user can input something-->
                        <div class="input-group mb-3"></div> <!-- Input + Button group together-->
                        <input type="text" id="taskInput" class="form-control" placeholder="Enter a new Task...."> <!--taskInput will use later in JS-->

                        <button class="btn btn-primary" id="addTaskBtn">
                            Add Task
                        </button>

                        <ul class="list-group" id="taskList">
                            <!-- Task will appear here -->

                        </ul>

                    </div>
                </div>
            </div>
        </div>

    </main>
    <footer>
        <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"></script>
    
    <script src="script.js"></script>
</body>

</html>
